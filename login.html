
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AILAT DATA</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f3ff;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 color:#24134d;
 padding:15px;
}

.brand-mark{
 width:76px;height:76px;display:block;object-fit:contain;
 margin:0 auto 12px;
 filter:drop-shadow(0 6px 12px #6d28d922);
}

.container{
 width:100%;
 max-width:400px;
 background:white;
 padding:28px 22px;
 border-radius:18px;
 box-shadow:0 4px 15px #00000010;
}

.logo{
 text-align:center;
 color:#5b21b6;
 font-size:27px;
 font-weight:bold;
}

.subtitle{
 text-align:center;
 color:#888;
 margin-bottom:25px;
}

label{
 display:block;
 margin:15px 0 7px;
 font-weight:bold;
 font-size:14px;
}

input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:15px;
 outline:none;
}

input:focus{
 border-color:#6d28d9;
}

.password-box{
 position:relative;
}

.password-box input{
 padding-right:55px;
}

.toggle-password{
 position:absolute;
 right:10px;
 top:50%;
 transform:translateY(-50%);
 width:38px;
 height:38px;
 border:0;
 background:transparent;
 color:#6d28d9;
 font-size:21px;
 cursor:pointer;
 padding:0;
 margin:0;
}

.login-button{
 width:100%;
 padding:15px;
 background:#6d28d9;
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 margin-top:22px;
 cursor:pointer;
}

.login-button:disabled{
 opacity:0.6;
}

.resend-button{
 width:100%;
 padding:12px;
 background:#ede9fe;
 color:#5b21b6;
 border:1px solid #ddd6fe;
 border-radius:10px;
 font-size:14px;
 font-weight:bold;
 margin-top:12px;
 cursor:pointer;
 display:none;
}

.links{
 text-align:center;
 margin-top:20px;
 font-size:14px;
}

a{
 color:#6d28d9;
 text-decoration:none;
}

.note{
 font-size:12px;
 color:#888;
 text-align:center;
 margin-top:20px;
}
</style>
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
</head>

<body>

<div class="container">

<img class="brand-mark" src="assets/ailat-mark.svg" alt="AILAT DATA logo">
<div class="logo">AILAT DATA</div>
<p class="subtitle">Welcome Back!</p>

<form id="loginForm">

<label>Email Address</label>
<input
 type="email"
 id="email"
 placeholder="Enter your email"
 autocomplete="email"
 required
>

<label>Password</label>

<div class="password-box">
<input
 type="password"
 id="password"
 placeholder="Enter your password"
 autocomplete="current-password"
 required
>

<button
 type="button"
 class="toggle-password"
 id="togglePassword"
 aria-label="Show password"
 aria-pressed="false"
>👁️</button>
</div>

<button type="submit" class="login-button" id="loginBtn">
Login
</button>

<button type="button" class="resend-button" id="resendBtn">
Resend Verification Email
</button>

</form>

<div class="links">
Don't have an account?
<a href="register.html">Register Now</a>
</div>

<p class="note">AILAT DATA © 2026</p>

</div>

<script type="module">

import { app } from "./firebase.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 sendEmailVerification,
 signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const auth = getAuth(app);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginBtn");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const resendBtn = document.getElementById("resendBtn");

let verificationUser = null;

// SHOW AND HIDE PASSWORD

togglePassword.addEventListener("click", function(){

 if(passwordInput.type === "password"){

  passwordInput.type = "text";
  togglePassword.textContent = "🙈";
  togglePassword.setAttribute("aria-label","Hide password");
  togglePassword.setAttribute("aria-pressed","true");

 }else{

  passwordInput.type = "password";
  togglePassword.textContent = "👁️";
  togglePassword.setAttribute("aria-label","Show password");
  togglePassword.setAttribute("aria-pressed","false");

 }

});

// LOGIN

form.addEventListener("submit", async function(event){

 event.preventDefault();

 const email = document.getElementById("email").value.trim();
 const password = passwordInput.value;

 button.disabled = true;
 button.textContent = "Checking Account...";
 resendBtn.style.display = "none";

 try {

  const result = await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

  const user = result.user;

  if(!user.emailVerified){

   verificationUser = user;

   await sendEmailVerification(user);
   await signOut(auth);

   alert(
    "Your email is not verified yet. A verification link has been sent to your email. Please check your inbox or spam folder."
   );

   resendBtn.style.display = "block";

   return;
  }

  alert("Login successful!");

  window.location.href = "dashboard.html";

 } catch(error) {

  console.error(error);

  if(error.code === "auth/invalid-credential"){
   alert("Incorrect email or password.");
  }else if(error.code === "auth/invalid-email"){
   alert("Invalid email address.");
  }else if(error.code === "auth/too-many-requests"){
   alert("Too many attempts. Please try again later.");
  }else{
   alert("Login failed: " + error.message);
  }

 } finally {

  button.disabled = false;
  button.textContent = "Login";

 }

});

// RESEND VERIFICATION EMAIL

resendBtn.addEventListener("click", async function(){

 const email = document.getElementById("email").value.trim();
 const password = passwordInput.value;

 resendBtn.disabled = true;
 resendBtn.textContent = "Sending...";

 try{

  let user = verificationUser;

  if(!user){

   const result = await signInWithEmailAndPassword(
    auth,
    email,
    password
   );

   user = result.user;
  }

  await user.reload();

  if(user.emailVerified){

   alert("Email already verified. You can now login.");
   await signOut(auth);
   resendBtn.style.display = "none";

  }else{

   await sendEmailVerification(user);

   alert("Verification email sent successfully. Please check your inbox.");

   await signOut(auth);
  }

  verificationUser = null;

 }catch(error){

  console.error(error);

  alert("Could not send verification email: " + error.message);

 }finally{

  resendBtn.disabled = false;
  resendBtn.textContent = "Resend Verification Email";

 }

});

</script>

</body>
</html>
