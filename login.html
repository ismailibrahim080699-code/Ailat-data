<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#14263f;
 display:flex;
 justify-content:center;

.brand-logo{

 margin:0 auto 12px;

}

.container{
 width:100%;
 max-width:400px;
 background:white;
 padding:28px 22px;
 border-radius:18px;
 box-shadow:0 4px 15px #00000010;
}

.logo{
 text-align:center;
 color:#b8944e;

}

.subtitle{

label{

input{

}

}

.password-box{

}

.password-box input{
 padding-right:55px;
}

.toggle-password{
 position:absolute;
 right:10px;
 top:50%;
 transform:translateY(-50%);
 width:38px;
 height:38px;
 border:0;
 background:transparent;
 color:#b8944e;
 font-size:21px;
 cursor:pointer;
 padding:0;
 margin:0;
}

.login-button{
 width:100%;
 padding:15px;
 background:linear-gradient(135deg,#d7bd82,#b8944e);
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 margin-top:22px;
 cursor:pointer;
}

.login-button:disabled{
 opacity:0.6;
}

.resend-button{
 width:100%;
 padding:12px;
 background:#ede9fe;
 color:#5b21b6;
 border:1px solid #ddd6fe;
 border-radius:10px;
 font-size:14px;
 font-weight:bold;
 margin-top:12px;
 cursor:pointer;
 display:none;
}

.links{
 text-align:center;
 margin-top:20px;
 font-size:14px;
}

a{
 color:#6d28d9;
 text-decoration:none;
}

.form-message{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.5}.form-message.show{display:block}.form-message.error{color:#b42318;background:#fff4f2;border:1px solid #fecaca}.form-message.success{color:#176b3a;background:#e9f8ef;border:1px solid #bbf7d0}

.note{
 font-size:12px;
 color:#888;
 text-align:center;
 margin-top:20px;
}

#ailatBiometricPrompt{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;padding:22px;background:#07152ff2;color:#fff;text-align:center}
#ailatBiometricPrompt .bio-card{width:min(100%,350px);padding:28px 22px;border:1px solid #e2b84f77;border-radius:22px;background:linear-gradient(145deg,#102d52,#07152f);box-shadow:0 20px 60px #0006}
#ailatBiometricPrompt .bio-icon{width:96px;height:96px;margin:20px auto;border:2px solid #e2b84f;border-radius:50%;display:grid;place-items:center;color:#f3d98e;font-size:48px}
#ailatBiometricPrompt p{color:#e7edf6;line-height:1.5;font-size:13px}
#ailatBiometricPrompt .bio-cancel{width:100%;padding:13px;border:1px solid #e2b84f;border-radius:10px;background:#ffffff12;color:#fff;font-weight:700}
#ailatBioEmailAssist{display:none;margin-top:14px;text-align:left}
#ailatBioEmailAssist input{width:100%;padding:13px;border:1px solid #d8c58d;border-radius:9px;font-size:15px;color:#14263f;background:#fff}
#ailatBioEmailAssist button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:#f3d98e;color:#07152f;font-weight:800}
#ailatBioEmailAssist small{display:block;color:#e7edf6;line-height:1.45;margin-bottom:9px}

<body>
<div id="ailatBiometricPrompt" role="dialog" aria-modal="true" aria-label="Fingerprint sign in"><div class="bio-card"><div style="font-weight:800;letter-spacing:1px;color:#f3d98e">AILAT DATA SUB</div><h2 style="color:#fff;margin:18px 0 6px">Sign in with fingerprint</h2><div class="bio-icon" aria-hidden="true" style="font-size:0">
<svg viewBox="0 0 96 96" width="66" height="66" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fingerprint">
 <path d="M48 12c-19 0-34 15-34 34"/>
 <path d="M48 22c-13 0-24 11-24 24"/>
 <path d="M48 32c-8 0-14 6-14 14 0 13-2 22-7 31"/>
 <path d="M48 22c13 0 24 11 24 24 0 17-2 28-7 38"/>
 <path d="M48 32c8 0 14 6 14 14 0 18-1 29-5 39"/>
 <path d="M48 42c2 0 4 2 4 4 0 18-1 30-3 38"/>
 <path d="M14 53c1 13-2 23-7 32"/>
 <path d="M82 53c-1 12 2 22 7 30"/>
 <path d="M34 57c0 12-2 21-6 29"/>
</svg>
</div><p id="ailatBioMessage">Use your saved AILAT DATA SUB passkey to sign in securely.</p><button type="button" class="bio-cancel" id="ailatBioStart" style="background:linear-gradient(135deg,#e2c36f,#b8944e);color:#07152f;margin:10px 0">Continue with fingerprint</button><button type="button" class="bio-cancel" id="ailatBioCancel">Use Email &amp; Password</button><div id="ailatBioEmailAssist"><small>No passkey was found automatically. Enter your account email to find your already registered device.</small><input type="email" id="ailatBioEmail" autocomplete="username" placeholder="Your account email"><button type="button" id="ailatBioFind">Find my saved passkey</button></div></div></div>

<div class="container">

<img class="brand-logo" src="assets/ailat-logo.svg?v=20261129" alt="AILAT DATA SUB — Your Trusted Digital Partner">
<p class="subtitle">Welcome Back!</p>

<form id="loginForm">

<label>Email Address</label>
<input
 type="email"
 id="email"
 placeholder="Enter your email"
 autocomplete="email"
 required
>

<label>Password</label>

<div class="password-box">
<input
 type="password"
 id="password"
 placeholder="Enter your password"
 autocomplete="current-password"
 required
>

<button
 type="button"
 class="toggle-password"
 id="togglePassword"
 aria-label="Show password"
 aria-pressed="false"
>👁️</button>
</div>

<p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
<button type="submit" class="login-button" id="loginBtn">
Login
</button>

<button type="button" class="resend-button" id="resendBtn">
Resend Verification Email
</button>

</form>

<div class="links">
Don't have an account?
<a href="register.html">Register Now</a>
</div>

<p class="note">AILAT DATA SUB © 2026</p>

</div>

<script type="module">
import { app } from "./firebase.js";
import { getAuth, signInWithEmailAndPassword, signInWithCustomToken, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
const auth=getAuth(app);
const form=document.getElementById("loginForm"),button=document.getElementById("loginBtn"),passwordInput=document.getElementById("password"),togglePassword=document.getElementById("togglePassword"),resendBtn=document.getElementById("resendBtn"),formMessage=document.getElementById("formMessage");
function showLoginMessage(message,type="error"){formMessage.textContent=message;formMessage.className="form-message show "+type;}
togglePassword.addEventListener("click",()=>{const show=passwordInput.type==="password";passwordInput.type=show?"text":"password";togglePassword.textContent=show?"🙈":"👁️";togglePassword.setAttribute("aria-label",show?"Hide password":"Show password");togglePassword.setAttribute("aria-pressed",String(show));});
function fromB64url(value){const s=String(value||"").replace(/-/g,"+").replace(/_/g,"/");const raw=atob(s+"=".repeat((4-s.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
function requestOptions(o){return {...o,challenge:fromB64url(o.challenge),allowCredentials:(o.allowCredentials||[]).map(x=>({...x,id:fromB64url(x.id)}))};}
function authenticationJSON(c){const b64=b=>{const a=new Uint8Array(b);let s="";for(const x of a)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");};return {id:c.id,rawId:b64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{clientDataJSON:b64(c.response.clientDataJSON),authenticatorData:b64(c.response.authenticatorData),signature:b64(c.response.signature),userHandle:c.response.userHandle?b64(c.response.userHandle):null}};}
async function passkeyRequest(user,method="GET",body=null){const token=await user.getIdToken(true);const response=await fetch("https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-transaction-passkeys",{method,headers:{"Authorization":"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json().catch(()=>({success:false,error:"Invalid security response"}));if(!response.ok||!data.success)throw new Error(data.error||"Device security check failed.");return data;}
async function verifyRegisteredDevice(user){
 const saved=await passkeyRequest(user);
 if(!saved.passkeys?.length)return false;
 if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials?.get)throw new Error("This browser cannot verify your registered device. Open AILAT DATA SUB in Chrome on your phone.");
 const begin=await passkeyRequest(user,"POST",{action:"start_authentication"});
 const credential=await navigator.credentials.get({publicKey:requestOptions(begin.options)});
 if(!credential)throw new Error("Fingerprint verification was cancelled.");
 const verified=await passkeyRequest(user,"POST",{action:"finish_authentication",response:authenticationJSON(credential)});
 if(!verified.verified)throw new Error("Fingerprint verification was not successful.");
 return true;
}

const biometricPrompt=document.getElementById("ailatBiometricPrompt");
const biometricMessage=document.getElementById("ailatBioMessage");
const biometricStart=document.getElementById("ailatBioStart");
const biometricCancel=document.getElementById("ailatBioCancel");
const biometricEmailAssist=document.getElementById("ailatBioEmailAssist");
const biometricEmail=document.getElementById("ailatBioEmail");
const biometricFind=document.getElementById("ailatBioFind");

let loginSubmitted=false;
form.style.display="none";
biometricPrompt.style.display="flex";
document.body.style.overflow="hidden";
// No email field is required for discoverable passkey-first sign-in.
async function biometricFallback(){
 biometricPrompt.style.display="none";
 document.body.style.overflow="";
 form.style.display="";
 if(auth.currentUser){try{await signOut(auth);}catch(error){console.warn("Could not clear previous session:",error);}}
}
biometricCancel.addEventListener("click",biometricFallback);
biometricStart.addEventListener("click",async()=>{
 if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials?.get){
  biometricMessage.textContent="Fingerprint sign-in is not supported in this browser. Use email and password instead.";return;
 }
 biometricStart.disabled=true;biometricStart.textContent="Waiting for fingerprint...";
 try{
  const endpoint="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-transaction-passkeys";
  const call=async body=>{
   const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   const data=await response.json().catch(()=>({success:false,error:"Invalid security response"}));
   if(!response.ok||!data.success)throw new Error(data.error||"Fingerprint sign-in could not be completed.");
   return data;
  };
  const begin=await call({action:"start_passkey_login"});
  const credential=await navigator.credentials.get({publicKey:requestOptions(begin.options)});
  if(!credential)throw new Error("Fingerprint verification was cancelled.");
  const finish=await call({action:"finish_passkey_login",challenge_id:begin.challenge_id,response:authenticationJSON(credential)});
  if(!finish.custom_token)throw new Error("Secure sign-in could not be completed.");
  const signed=await signInWithCustomToken(auth,finish.custom_token);
  await signed.user.reload();
  if(!signed.user.emailVerified){await signOut(auth);throw new Error("Verify your email before signing in.");}
  window.location.replace("dashboard.html");
 }catch(error){
  console.error("Fingerprint-first login:",error);
  biometricMessage.textContent=(error.message||"Fingerprint sign-in could not find the saved device.")+" You can also look up your existing passkey using your account email.";
  biometricEmailAssist.style.display="block";
  biometricStart.disabled=false;biometricStart.textContent="Try fingerprint again";
 }
});
biometricFind.addEventListener("click",async()=>{
 const email=biometricEmail.value.trim();
 if(!email){biometricMessage.textContent="Enter the email address used for your AILAT DATA SUB account.";biometricEmail.focus();return;}
 biometricFind.disabled=true;biometricFind.textContent="Finding saved device...";
 try{
  const endpoint="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-transaction-passkeys";
  const call=async body=>{
   const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   const data=await response.json().catch(()=>({success:false,error:"Invalid security response"}));
   if(!response.ok||!data.success)throw new Error(data.error||"Could not find the saved device.");
   return data;
  };
  const begin=await call({action:"start_passkey_login_with_email",email});
  biometricMessage.textContent="Choose your saved AILAT DATA SUB passkey and verify with your phone's fingerprint.";
  const credential=await navigator.credentials.get({publicKey:requestOptions(begin.options)});
  if(!credential)throw new Error("Saved-device verification was cancelled.");
  const finish=await call({action:"finish_passkey_login_with_email",challenge_id:begin.challenge_id,response:authenticationJSON(credential)});
  if(!finish.custom_token)throw new Error("Secure sign-in could not be completed.");
  const signed=await signInWithCustomToken(auth,finish.custom_token);
  await signed.user.reload();
  if(!signed.user.emailVerified){await signOut(auth);throw new Error("Verify your email before signing in.");}
  window.location.replace("dashboard.html");
 }catch(error){
  console.error("Saved passkey lookup:",error);
  biometricMessage.textContent=error.message||"Could not verify the saved device. Use email and password.";
  biometricFind.disabled=false;biometricFind.textContent="Find my saved passkey";
 }
});
form.addEventListener("submit",async event=>{
 event.preventDefault();loginSubmitted=true;formMessage.className="form-message";formMessage.textContent="";
 const email=document.getElementById("email").value.trim(),password=passwordInput.value;
 button.disabled=true;button.textContent="Checking Account...";resendBtn.style.display="none";
 let signedInUser=null;
 try{
  const result=await signInWithEmailAndPassword(auth,email,password);signedInUser=result.user;
  await signedInUser.reload();
  if(!signedInUser.emailVerified){
   try{await sendEmailVerification(signedInUser);showLoginMessage("Your email is not verified. A verification link has been sent. Check your inbox or spam folder.");resendBtn.style.display="block";}
   finally{await signOut(auth);signedInUser=null;}
   return;
  }
  // Biometric login is temporarily bypassed to restore reliable account access.
  // Transaction PIN and Firebase email/password authentication remain enforced.
  window.location.href="dashboard.html";
 }catch(error){
  console.error("AILAT login/device verification:",error);
  if(signedInUser){try{await signOut(auth);}catch(signOutError){console.error(signOutError);}}
  if(error.name==="NotAllowedError"||error.name==="AbortError")showLoginMessage("Fingerprint was cancelled or timed out. Please try logging in again.");
  else if(error.code==="auth/invalid-credential")showLoginMessage("Incorrect email or password.");
  else if(error.code==="auth/invalid-email")showLoginMessage("Invalid email address.");
  else if(error.code==="auth/too-many-requests")showLoginMessage("Too many attempts. Please try again later.");
  else if(error.code==="auth/network-request-failed")showLoginMessage("Network connection failed. Check your internet and try again.");
  else if(error.code==="auth/user-disabled")showLoginMessage("This account is disabled. Please contact support.");
  else showLoginMessage(error.message||"Login could not be completed. Please try again.");
 }finally{button.disabled=false;button.textContent="Login";}
});
resendBtn.addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(),password=passwordInput.value;
 if(!email||!password){showLoginMessage("Enter your email and password to resend the verification email.");return;}
 resendBtn.disabled=true;resendBtn.textContent="Sending...";
 try{const result=await signInWithEmailAndPassword(auth,email,password);await result.user.reload();if(result.user.emailVerified){await signOut(auth);showLoginMessage("Email already verified. You can now login.","success");resendBtn.style.display="none";}else{await sendEmailVerification(result.user);await signOut(auth);showLoginMessage("Verification email sent successfully. Check your inbox or spam folder.","success");}}
 catch(error){try{if(auth.currentUser)await signOut(auth);}catch(_){}showLoginMessage(error.code==="auth/invalid-credential"?"Incorrect email or password.":"Could not resend verification email. Please try again.");}
 finally{resendBtn.disabled=false;resendBtn.textContent="Resend Verification Email";}
});
</script>
