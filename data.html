
<!DOCTYPE html>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
 background:#f5f3ff;

}

.container{
 max-width:480px;
 margin:auto;
 min-height:100vh;
 padding-bottom:35px;
}

header{
 background:linear-gradient(135deg,#35106f,#5b21b6,#7c3aed);
 color:white;
 padding:22px 20px;
 display:flex;
 align-items:center;
 gap:15px;
}

.back{

}

header h2{font-size:19px}

.content{padding:22px 18px}

.subtitle{

}

 border:1px solid #e5e1ed;

}

select:focus,input:focus{
 border-color:#6425c5;
}

.networks{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px;
}

.network{
 border:1px solid #e8e3f0;
 border-radius:12px;
 padding:12px 4px;
 text-align:center;
 cursor:pointer;
 background:white;
 min-width:0;
 min-height:95px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:8px;
 transition:.2s;
}

.network.active{
 border:2px solid #6425c5;
 background:#f5efff;
 box-shadow:0 3px 10px #6425c51a;
}

.network img{
 width:48px;
 height:43px;
 object-fit:contain;
 display:block;
}

.network .network-name{
 font-size:11px;
 font-weight:800;
 color:#352052;
}

.network.active .network-name{
 color:#6425c5;
}

.network .vitel-logo-img{width:48px;height:43px;object-fit:contain;display:block;background:transparent;border-radius:0}

}
