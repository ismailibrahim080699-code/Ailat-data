name: Buy Data contract checks

on:
  push:
    branches: [main]
    paths:
      - "data.html"
      - "order_summary.html"
      - "tests/buy-data-contract.test.mjs"
      - ".github/workflows/buy-data-contract.yml"
  pull_request:
    paths:
      - "data.html"
      - "order_summary.html"
      - "tests/buy-data-contract.test.mjs"
      - ".github/workflows/buy-data-contract.yml"

jobs:
  buy-data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/buy-data-contract.test.mjs
