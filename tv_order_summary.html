<!DOCTYPE html>
<html lang="en">
<head>

<title>TV Subscription - AILAT DATA</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#f5f3ff;color:#24134d;padding:20px}

.notice{background:#fff7e5;color:#795600;padding:14px;border-radius:12px;font-size:13px;line-height:1.7;text-align:left;margin:20px 0}
button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#702bd1,#4520a0);color:white;font-size:15px;font-weight:bold}

</head>
<body>
<main class="container">
<h2>Cable TV Subscription</h2>

<button type="button" onclick="location.href='tv.html'">Back to Cable TV</button>
