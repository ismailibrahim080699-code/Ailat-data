<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
<title>AILAT DATA SUB | Support Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#172b3a;font-family:Arial,sans-serif}
header{padding:23px 19px 28px;background:linear-gradient(135deg,#102a43,#0f766e,#155e75);color:#fff;border-radius:0 0 26px 26px}
header a{color:#d9f3ef;text-decoration:none;font-size:13px;font-weight:700}header h1{font-size:23px;margin:20px 0 6px}header p{font-size:12px;margin:0;color:#e1eeee}
.wrap{max-width:760px;margin:20px auto;padding:0 14px 35px}.card{background:#fff;border:1px solid #dce7ec;border-radius:17px;padding:16px;margin-bottom:13px}
.status{font-size:12px;line-height:1.6;color:#0f766e;white-space:pre-wrap}.ticket{border-bottom:1px solid #edf2f5;padding:15px 0}.ticket:last-child{border:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.ref{font-weight:900;color:#0f766e;font-size:12px}.pill{background:#e1f0ef;color:#0f766e;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800}
h2{font-size:15px;margin:12px 0 7px}p{font-size:12px;line-height:1.6;color:#718693;white-space:pre-wrap;overflow-wrap:anywhere}
label{display:block;font-size:11px;font-weight:800;margin:12px 0 6px;color:#34505e}
textarea,select{width:100%;border:1px solid #d4e0e5;border-radius:10px;padding:11px;font:13px Arial;background:#fbfdfe;color:#172b3a}
textarea{min-height:85px;resize:vertical}button{border:0;border-radius:10px;padding:12px 15px;background:linear-gradient(135deg,#0f766e,#155e75);color:#fff;font-size:12px;font-weight:800;margin-top:10px}
button.secondary{background:#e1f0ef;color:#0f766e}.reply{background:#f0f7f6;border-radius:10px;padding:10px;font-size:12px;color:#345b57;white-space:pre-wrap;margin-top:8px}
</style>
  
<link rel="stylesheet" href="assets/ailat-popups.css?v=1">
<link rel="stylesheet" href="assets/ailat-theme.css?v=3">
</head>
<body>
<header><img src="assets/ailat-logo.svg?v=20261128" alt="AILAT DATA SUB" style="display:block;width:min(190px,58vw);height:68px;object-fit:contain;margin:0 auto 10px"><a href="dashboard.html">← Dashboard</a><h1>Support Admin</h1><p>Review customer tickets and send replies.</p></header>
<main class="wrap">
 <section class="card"><div id="adminStatus" class="status">Checking administrator access…</div><button id="refresh" class="secondary" type="button">Refresh tickets</button></section>
 <section class="card"><h2>Customer support tickets</h2><div id="tickets" class="status">Loading…</div></section>
</main>
<script type="module">
import {app} from "./firebase.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
const auth=getAuth(app);
const API="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-customer-support";
const API_KEY="sb_publishable_9wmzpjzVhnby_E3jogTjRw_c22XiDEC";
const status=document.getElementById("adminStatus");
const list=document.getElementById("tickets");
let user=null;
async function api(path="",method="GET",body){
 if(!user)throw new Error("Please sign in.");
 const token=await user.getIdToken(true);
 const response=await fetch(API+path,{method,headers:{"apikey":API_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const data=await response.json().catch(()=>({}));
 if(!response.ok||!data.success)throw new Error(data.error||"Request failed.");
 return data;
}
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=value??"";return n;}
async function load(){
 list.textContent="Loading tickets…";
 try{
  const data=await api("?admin=1");
  list.replaceChildren();
  if(!data.tickets.length){list.textContent="No customer tickets yet.";return;}
  for(const t of data.tickets){
   const item=node("article","ticket","");
   const top=node("div","top","");
   top.append(node("span","ref",t.ticket_ref),node("span","pill",String(t.status).replaceAll("_"," ").toUpperCase()));
   item.append(top,node("h2","",t.subject),node("p","", "Customer UID: "+t.user_id+"\nTopic: "+t.category+"\n"+new Date(t.created_at).toLocaleString()),node("p","",t.message));
   if(t.admin_reply)item.append(node("div","reply","Previous reply: "+t.admin_reply));
   const statusLabel=node("label","","Ticket status");
   const select=node("select","");
   for(const [value,label] of [["open","Open"],["in_review","In review"],["resolved","Resolved"],["closed","Closed"]]){const opt=document.createElement("option");opt.value=value;opt.textContent=label;select.append(opt);}
   select.value=t.status;
   const replyLabel=node("label","","Reply to customer");
   const reply=document.createElement("textarea");reply.maxLength=2000;reply.placeholder="Write a clear response…";reply.value=t.admin_reply||"";
   const save=node("button","","Save status and reply");
   save.addEventListener("click",async()=>{
    save.disabled=true;save.textContent="Saving…";
    try{await api("","PATCH",{ticket_ref:t.ticket_ref,status:select.value,admin_reply:reply.value.trim()});status.textContent="Ticket "+t.ticket_ref+" updated.";await load();}
    catch(e){status.textContent=e.message;save.disabled=false;save.textContent="Save status and reply";}
   });
   item.append(statusLabel,select,replyLabel,reply,save);
   list.append(item);
  }
 }catch(e){list.textContent=e.message;status.textContent=e.message;}
}
onAuthStateChanged(auth,async u=>{
 if(!u){location.replace("login.html");return;}
 user=u;
 try{await u.reload();if(!u.emailVerified){await signOut(auth);location.replace("login.html");return;}
  status.textContent="Signed in. Checking support administrator permission…";await load();
 }catch(e){status.textContent=e.message;}
});
document.getElementById("refresh").addEventListener("click",load);
</script>
<script src="assets/ailat-popups.js?v=1"></script>
</body>
</html>
