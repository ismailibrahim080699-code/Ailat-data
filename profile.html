<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4c1d95"><link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg"><title>My Profile - AILAT DATA SUB</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f3ff;
 color:#24134d;
}
header{position:relative;background:#f4f5f7;color:#303342;padding:76px 20px 22px;border-radius:0 0 22px 22px}
header h2{margin:0}
.container{
 padding:20px;
 max-width:450px;
 margin:auto;
}
.profile-card{
 background:white;
 padding:22px;
 border-radius:16px;
 box-shadow:0 4px 12px #00000010;
}
.avatar{
 width:75px;
 height:75px;
 border-radius:50%;
 background:#ede9fe;
 color:#6d28d9;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:35px;
 margin:auto;
}
.profile-title{
 text-align:center;
 margin:12px 0 25px;
}
.info{
 padding:13px 0;
 border-bottom:1px solid #eee;
}
.info:last-child{border:0}
.label{
 font-size:12px;
 color:#888;
 margin-bottom:6px;
}
.value{
 font-size:15px;
 font-weight:bold;
 overflow-wrap:anywhere;
}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#6d28d9;
 color:white;
 font-size:15px;
 font-weight:bold;
 margin-top:18px;
}
.back{background:#f3efff;color:#5b21b6;border:1px solid #e7ddff}
.top-back{position:absolute;top:16px;left:16px;display:grid;place-items:center;width:42px;height:42px;margin:0;border:0;border-radius:50%;background:#f3efff;color:#5b21b6!important;text-decoration:none;font-size:27px;line-height:1;box-shadow:0 2px 8px #00000008}\n.top-back:active{background:#ffffff30}\n#logoutBtn{background:#fff0f0!important;color:#b42318!important;border:1px solid #ffd5d2!important}\n#logoutBtn:disabled{opacity:.65}
</style>  
<link rel="stylesheet" href="assets/ailat-popups.css?v=1">
<link rel="stylesheet" href="assets/ailat-theme.css?v=3">
</head><body><header><img src="assets/ailat-logo.svg" alt="AILAT DATA SUB" style="display:block;width:170px;height:64px;object-fit:contain;margin:0 auto 14px">
<a class="top-back" href="dashboard.html" aria-label="Back to dashboard">‹</a>
<h2>AILAT DATA SUB</h2>
<p>My Profile</p>
</header><div class="container"><div class="profile-card"><div class="avatar">👤</div><div class="profile-title">
<h3>My Account</h3>
<p>Personal Information</p>
</div><div class="info">
<div class="label">Full Name</div>
<div class="value" id="name">Loading...</div>
</div><div class="info">
<div class="label">Email Address</div>
<div class="value" id="email">Loading...</div>
</div><div class="info">
<div class="label">Phone Number</div>
<div class="value" id="phone">Loading...</div>
</div><div class="info">
<div class="label">Referral Code</div>
<div class="value" id="referral">Not provided</div>
</div><button class="back" onclick="location.href='settings.html'">
Account Settings & Security
</button>
<button id="logoutBtn">
Logout
</button></div>
</div><script type="module">

import { app } from "./firebase.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

 if (!user) {
  window.location.href = "login.html";
  return;
 }

 try {
  await user.reload();
  if (!user.emailVerified) {
   await signOut(auth);
   alert("Please verify your email before accessing your profile.");
   window.location.href = "login.html";
   return;
  }

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {

   const data = userSnap.data();

   document.getElementById("name").textContent =
    data.name || "Not available";

   document.getElementById("email").textContent =
    data.email || user.email || "Not available";

   document.getElementById("phone").textContent =
    data.phone || "Not provided";

   document.getElementById("referral").textContent =
    data.referralCode || "Not provided";

  } else {
   document.getElementById("name").textContent = "Not available";
   document.getElementById("email").textContent = user.email || "Not available";
   document.getElementById("phone").textContent = "Not provided";
   document.getElementById("referral").textContent = "Not provided";
   alert("Profile information was not found. Please contact support.");
  }

 } catch(error) {
  console.error(error);
  alert("Unable to load profile information.");
 }

});

document.getElementById("logoutBtn").addEventListener("click", async () => {

 try {
  await signOut(auth);
  window.location.href = "login.html";
 } catch(error) {
  alert("Logout failed.");
 }

});

</script>
<script src="assets/ailat-popups.js?v=1"></script>
</body>
</html>
