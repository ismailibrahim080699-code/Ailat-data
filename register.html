
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - AILAT DATA SUB</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 16px;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif;color:#14263f;background:radial-gradient(circle at top left,#294f70 0,#14263f 42%,#0b1828 100%)}
.container{width:100%;max-width:440px;background:rgba(255,255,255,.96);padding:34px 30px 28px;border:1px solid #fff;border-radius:24px;box-shadow:0 22px 65px rgba(55,25,100,.13)}
.brand-logo{width:100%;max-width:330px;height:auto;margin:0 auto 12px;display:block;object-fit:contain;filter:drop-shadow(0 6px 12px #6d28d922)}
.logo{text-align:center;color:#b8944e;font-size:23px;font-weight:800;letter-spacing:1.2px}
.subtitle{text-align:center;color:#817694;font-size:14px;margin:8px 0 26px}
label{display:block;margin:16px 0 7px;font-size:13px;font-weight:700;color:#44345f}
input{width:100%;padding:14px 15px;border:1px solid #e4deef;border-radius:11px;background:#fcfbff;font-size:14px;color:#24134d;transition:.2s}
input::placeholder{color:#aaa1b9}
input:focus{outline:none;border-color:#b8944e;background:white;box-shadow:0 0 0 4px #8b5cf618}
.password-box{position:relative}
.password-box input{padding-right:64px}
.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;padding:0;margin:0;background:transparent;color:#7650ad;border:0;border-radius:9px;cursor:pointer;box-shadow:none}
.toggle-password:hover{background:#f2edff;box-shadow:none;transform:translateY(-50%)}
.toggle-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field-hint{font-size:11px;line-height:1.5;color:#9187a2;margin:7px 1px 0}
.form-error{display:none;color:#b42318;background:#fff4f2;border:1px solid #fecaca;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.5;margin-top:16px}.form-error.show{display:block}input.input-error{border-color:#dc2626;background:#fffafa}
button{width:100%;padding:15px;border:0;border-radius:11px;background:linear-gradient(110deg,#d7bd82,#b8944e);color:white;font-size:14px;font-weight:700;letter-spacing:.2px;margin-top:23px;cursor:pointer;box-shadow:0 9px 20px #6d28d926;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 12px 24px #6d28d933}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.links{text-align:center;margin-top:22px;font-size:13px;color:#817694}
a{color:#6d28d9;text-decoration:none;font-weight:700}
.note{font-size:11px;color:#9b92aa;text-align:center;margin:18px 0 0;line-height:1.5}
@media(max-width:420px){body{padding:18px 12px}.container{padding:28px 21px;border-radius:20px}}
</style>
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg?v=20261129">
<link rel="stylesheet" href="assets/ailat-popups.css?v=1">

<link rel="stylesheet" href="assets/ailat-theme.css?v=4">
<link rel="manifest" href="/manifest.webmanifest?v=1"><meta name="theme-color" content="#07152f">
</head>

<body>

<div class="container">

<img class="brand-logo" src="assets/ailat-logo.svg?v=20261129" alt="AILAT DATA SUB — Your Trusted Digital Partner">
<p class="subtitle">Create your account and get started</p>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name"
placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email"
placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" id="phone"
placeholder="Enter phone number"
maxlength="11" required>

<label>Password</label>

<div class="password-box">
<input type="password" id="password"
placeholder="Create a strong password"
minlength="6" required>

<button type="button"
class="toggle-password"
id="togglePassword"
aria-label="Show password"
aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<p class="field-hint">Use at least 6 characters for your password.</p>

<label>Confirm Password</label>

<div class="password-box">
<input type="password" id="confirmPassword"
placeholder="Confirm password"
minlength="8" required>

<button type="button"
class="toggle-password"
id="toggleConfirmPassword"
aria-label="Show password"
aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<label>Referral Code (Optional)</label>
<input type="text" id="referralCode"
placeholder="Enter referral code (if any)">

<p id="formError" class="form-error" role="alert" aria-live="polite"></p>
<button type="submit" id="registerBtn">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<a href="login.html">Login Now</a>
</div>

<p class="note">
Your password is securely handled by Firebase Authentication.
</p>

</div>

<script type="module">

import { app } from "./firebase.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 sendEmailVerification,
 deleteUser
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 writeBatch,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const auth = getAuth(app);
const db = getFirestore(app);
const REFERRAL_API = "https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-referral";

async function createShortReferralCode(uid){
 for(let attempt=0;attempt<40;attempt++){
  const bytes=new Uint32Array(1);
  crypto.getRandomValues(bytes);
  const code="AILAT"+String(bytes[0]%100000).padStart(5,"0");
  const snap=await getDoc(doc(db,"referralCodes",code));
  if(!snap.exists()||snap.data().ownerUid===uid)return code;
 }
 throw new Error("Could not create a unique referral code. Please try again.");
}

const form = document.getElementById("registerForm");
const button = document.getElementById("registerBtn");
const errorBox = document.getElementById("formError");
const referralInput = document.getElementById("referralCode");
function showRegisterError(message,field){errorBox.textContent=message;errorBox.classList.add("show");document.querySelectorAll("#registerForm input").forEach(input=>input.classList.remove("input-error"));if(field){field.classList.add("input-error");field.focus();field.scrollIntoView({behavior:"smooth",block:"center"});}}


const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

// PASSWORD VISIBILITY

function setupPasswordToggle(inputId, buttonId){

 const passwordInput =
 document.getElementById(inputId);

 const toggleButton =
 document.getElementById(buttonId);

 toggleButton.addEventListener("click", function(){

  if(passwordInput.type === "password"){

   passwordInput.type = "text";
   toggleButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
   toggleButton.setAttribute("aria-label","Hide password");
   toggleButton.setAttribute("aria-pressed","true");

  }else{

   passwordInput.type = "password";
   toggleButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15.8 15.8 0 01-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.4 10.4 0 004.1-.8"/></svg>';
   toggleButton.setAttribute("aria-label","Show password");
   toggleButton.setAttribute("aria-pressed","false");

  }

 });

}

setupPasswordToggle("password","togglePassword");
setupPasswordToggle("confirmPassword","toggleConfirmPassword");

// GET REFERRAL CODE FROM URL

const urlParams =
 new URLSearchParams(window.location.search);

const urlReferralCode =
 (urlParams.get("ref") || "").trim().toUpperCase();

if(urlReferralCode){
 referralInput.value = urlReferralCode;
}

// OPTIONAL DEVICE BIOMETRIC ENROLLMENT AFTER SUCCESSFUL REGISTRATION
function decodeB64url(value){const v=String(value||"").replace(/-/g,"+").replace(/_/g,"/");const raw=atob(v+"=".repeat((4-v.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
function encodeB64url(buffer){const bytes=new Uint8Array(buffer);let raw="";for(const byte of bytes)raw+=String.fromCharCode(byte);return btoa(raw).replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/g,"");}
async function registerTransactionBiometric(user){
 if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials?.create)throw new Error("This browser does not support device fingerprint registration. Use Chrome on a supported phone.");
 const token=await user.getIdToken(true);
 const endpoint="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-transaction-passkeys";
 const call=async(action,response)=>{const res=await fetch(endpoint,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action,...(response?{response}:{})})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||"Biometric setup could not be completed.");return data;};
 const begin=await call("start_registration");
 const options=begin.options;
 options.challenge=decodeB64url(options.challenge);
 options.user.id=decodeB64url(options.user.id);
 options.excludeCredentials=(options.excludeCredentials||[]).map(item=>({...item,id:decodeB64url(item.id)}));
 const credential=await navigator.credentials.create({publicKey:options});
 if(!credential)throw new Error("Device biometric registration was cancelled.");
 const response={id:credential.id,rawId:encodeB64url(credential.rawId),type:credential.type,authenticatorAttachment:credential.authenticatorAttachment,clientExtensionResults:credential.getClientExtensionResults(),response:{clientDataJSON:encodeB64url(credential.response.clientDataJSON),attestationObject:encodeB64url(credential.response.attestationObject),transports:credential.response.getTransports?credential.response.getTransports():[]}};
 return call("finish_registration",response);
}

// REGISTRATION

form.addEventListener("submit", async function(event){

 event.preventDefault();

 const name =
 document.getElementById("name").value.trim();

 const email =
 document.getElementById("email").value.trim();

 const phone =
 document.getElementById("phone").value.trim();

 const password = passwordInput.value;
 const confirmPassword = confirmInput.value;

 const referralCode =
 referralInput.value.trim().toUpperCase();

 errorBox.textContent="";errorBox.classList.remove("show");
 document.querySelectorAll("#registerForm input").forEach(input=>input.classList.remove("input-error"));
 if(name.length < 2){showRegisterError("Please enter your full name.",document.getElementById("name"));return;}
 if(!/^\d{11}$/.test(phone)){showRegisterError("Please enter a valid 11-digit phone number.",document.getElementById("phone"));return;}
 if(password.length < 6){showRegisterError("Password must contain at least 6 characters.",passwordInput);return;}
 if(password !== confirmPassword){showRegisterError("Passwords do not match.",confirmInput);return;}

 button.disabled = true;
 button.textContent = "Creating Account...";

 let createdUser = null;
 let profileSaved = false;

 try{

  let referrerUid = null;

  if(referralCode !== ""){

   const referralSnap = await getDoc(
    doc(db, "referralCodes", referralCode)
   );

   if(!referralSnap.exists()){
    throw new Error("Invalid Referral Code!");
   }

   referrerUid = referralSnap.data().ownerUid;

   if(!referrerUid){
    throw new Error("This Referral Code is not valid.");
   }

  }

  const result = await createUserWithEmailAndPassword(
   auth,
   email,
   password
  );

  createdUser = result.user;

  const uid = result.user.uid;

  if(referrerUid === uid){
   throw new Error("You cannot use your own referral code.");
  }

  const myReferralCode = await createShortReferralCode(uid);

  // SAVE THE USER, PERSONAL CODE AND REFERRAL AS ONE ATOMIC WRITE.
  // This prevents a partial referral record if any write is rejected.

  const batch = writeBatch(db);

  batch.set(doc(db, "users", uid), {
   name: name,
   email: email,
   phone: phone,
   walletBalance: 0,
   referralCode: myReferralCode,
   referredBy: referralCode || "",
   createdAt: serverTimestamp()
  });

  batch.set(doc(db, "referralCodes", myReferralCode), {
   ownerUid: uid,
   createdAt: serverTimestamp()
  });

  if(referralCode !== "" && referrerUid){
   batch.set(doc(db, "referrals", uid), {
    referralCode: referralCode,
    ownerUid: referrerUid,
    newUserUid: uid,
    joinedAt: serverTimestamp()
   });
  }

  await batch.commit();
  profileSaved = true;

  // Persist the referral attribution in the server-side ledger after the
  // Firebase referral record has been saved and verified by its public code.
  if(referralCode){
   try{
    const referralToken = await createdUser.getIdToken();
    const syncResponse = await fetch(REFERRAL_API,{
     method:"POST",
     headers:{"Content-Type":"application/json",Authorization:"Bearer "+referralToken},
     body:JSON.stringify({action:"sync_attribution",referral_code:referralCode})
    });
    const syncResult = await syncResponse.json();
    if(!syncResponse.ok || !syncResult.success){
     console.warn("Referral attribution sync pending:",syncResult.error||syncResponse.status);
    }
   }catch(syncError){
    console.warn("Referral attribution sync will be retried later:",syncError);
   }
  }

  // SEND EMAIL VERIFICATION

  await sendEmailVerification(result.user);

  let biometricMessage = "You can enable fingerprint later in Settings > Transaction Security.";
  const wantsBiometric = window.confirm("Account created successfully!\n\nWould you like to set up fingerprint / device biometric now to approve transactions?\n\nChoose OK to set it up, or Cancel to do it later.");
  if(wantsBiometric){
   try{
    button.textContent = "Setting up fingerprint...";
    const biometricResult = await registerTransactionBiometric(createdUser);
    biometricMessage = biometricResult.message || "Fingerprint setup completed successfully.";
   }catch(biometricError){
    console.error("Registration biometric setup:",biometricError);
    biometricMessage = "Fingerprint was not enabled now: " + biometricError.message + "\\nYou can enable it later in Settings > Transaction Security.";
   }
  }

  alert("Account created successfully! A verification email has been sent. Please verify your email before logging in.\\n\\n" + biometricMessage);
  try{await auth.signOut();}catch(signOutError){console.error("Post-registration sign out:",signOutError);}
  window.location.href = "login.html";

 }catch(error){

  console.error("Registration error:", error);
  errorBox.textContent="";errorBox.classList.remove("show");

  if(createdUser && !profileSaved){
   // The Firestore batch did not save the profile; clean up the new Auth account.
   try{
    await deleteUser(createdUser);
   }catch(cleanupError){
    console.error("Incomplete registration cleanup failed:", cleanupError);
    try{ await auth.signOut(); }catch(signOutError){ console.error("Sign out error:",signOutError); }
   }
  }else if(createdUser){
   try{
    await auth.signOut();
   }catch(signOutError){
    console.error("Sign out error:", signOutError);
   }
  }

  if(createdUser && profileSaved && error.code !== "auth/email-already-in-use"){
   showRegisterError("Your account details were saved, but the verification email could not be sent. Open Login and use Resend Verification Email.");
  }else if(error.code === "auth/email-already-in-use"){

   showRegisterError("This email is already registered.",document.getElementById("email"));

  }else if(error.code === "auth/weak-password"){

   showRegisterError("Password is too weak.",passwordInput);

  }else if(error.code === "auth/invalid-email"){

   showRegisterError("Invalid email address.",document.getElementById("email"));

  }else if(error.code === "auth/too-many-requests"){

   showRegisterError("Too many attempts. Please try again later.");

  }else if(error.code === "auth/operation-not-allowed"){

   showRegisterError("Email verification is not available. Please contact support.");

  }else{

   showRegisterError("Registration could not be completed. Please check your details and try again.");

  }

 }finally{

  button.disabled = false;
  button.textContent = "Create Account";

 }

});

</script>

<script src="assets/ailat-popups.js?v=1"></script>
<script src="/assets/ailat-pwa.js?v=1"></script>
</body>
 </html>
