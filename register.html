
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - AILAT DATA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#f5f3ff,#e9e2ff);
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.container{
 background:white;
 width:100%;
 max-width:430px;
 padding:28px 22px;
 border-radius:20px;
 box-shadow:0 10px 35px rgba(45,20,100,.13);
}
.logo{
 text-align:center;
 font-size:27px;
 font-weight:bold;
 color:#6425c5;
 margin-bottom:5px;
}
.subtitle{
 text-align:center;
 color:#777;
 margin-bottom:24px;
}
h2{
 text-align:center;
 color:#28134d;
 margin-bottom:22px;
}
label{
 display:block;
 font-weight:bold;
 color:#35205a;
 margin:13px 0 7px;
 font-size:14px;
}
input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:10px;
 outline:none;
 font-size:15px;
}
input:focus{
 border-color:#7136d6;
 box-shadow:0 0 0 2px #eee5ff;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:11px;
 background:linear-gradient(135deg,#7136d6,#4b1e9e);
 color:white;
 font-size:16px;
 font-weight:bold;
 margin-top:23px;
 cursor:pointer;
}
button:disabled{opacity:.6}
.footer{
 text-align:center;
 margin-top:20px;
 color:#666;
 font-size:14px;
}
.footer a{
 color:#6425c5;
 font-weight:bold;
 text-decoration:none;
}
#message{
 text-align:center;
 font-size:14px;
 margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">AILAT DATA</div>
<div class="subtitle">Welcome! Create your account</div>

<h2>Create Account</h2>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter 11 digit phone number" maxlength="11" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create password (minimum 8)" minlength="8" required>

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>

<label>Referral Code (Optional)</label>
<input type="text" id="referralCode" placeholder="Enter referral code">

<button type="submit" id="registerBtn">CREATE ACCOUNT</button>

</form>

<div id="message"></div>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyBv7ixj82ZWaSHyvv0dzg86MOUBae3pA94",
 authDomain: "ailat-data.firebaseapp.com",
 projectId: "ailat-data",
 storageBucket: "ailat-data.firebasestorage.app",
 messagingSenderId: "936036858829",
 appId: "1:936036858829:web:c9b72589796524b378a284"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const referralInput = document.getElementById("referralCode");
const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");

// Automatically fill referral code from URL
const urlParams = new URLSearchParams(window.location.search);
const urlReferralCode = (urlParams.get("ref") || "").trim().toUpperCase();

if(urlReferralCode){
 referralInput.value = urlReferralCode;
}

form.addEventListener("submit", async (e) => {

 e.preventDefault();

 const fullName = document.getElementById("fullName").value.trim();
 const email = document.getElementById("email").value.trim();
 const phone = document.getElementById("phone").value.trim();
 const password = document.getElementById("password").value;
 const confirmPassword = document.getElementById("confirmPassword").value;
 const referralCode = referralInput.value.trim().toUpperCase();

 if(phone.length !== 11 || !/^\d{11}$/.test(phone)){
  message.style.color = "red";
  message.textContent = "Enter a valid 11 digit phone number.";
  return;
 }

 if(password.length < 8){
  message.style.color = "red";
  message.textContent = "Password must be at least 8 characters.";
  return;
 }

 if(password !== confirmPassword){
  message.style.color = "red";
  message.textContent = "Passwords do not match.";
  return;
 }

 registerBtn.disabled = true;
 registerBtn.textContent = "PLEASE WAIT...";
 message.style.color = "#6425c5";
 message.textContent = "Creating your account...";

 try {

  // Check referral code before creating account
  let referrerUid = null;

  if(referralCode !== ""){
   const referralSnap = await getDoc(
    doc(db, "referralCodes", referralCode)
   );

   if(!referralSnap.exists()){
    throw new Error("Invalid Referral Code!");
   }

   referrerUid = referralSnap.data().ownerUid;
  }

  // Create account
  const userCredential = await createUserWithEmailAndPassword(
   auth,
   email,
   password
  );

  const user = userCredential.user;

  const myReferralCode =
   "AILAT" + user.uid.substring(0,8).toUpperCase();

  // Save user information
  await setDoc(doc(db, "users", user.uid), {
   name: fullName,
   email: email,
   phone: phone,
   referralCode: myReferralCode,
   referredBy: referrerUid || null,
   createdAt: serverTimestamp()
  });

  // Save personal referral code
  await setDoc(doc(db, "referralCodes", myReferralCode), {
   ownerUid: user.uid,
   createdAt: serverTimestamp()
  });

  // Save referral record
  if(referrerUid){
   await setDoc(doc(db, "referrals", user.uid), {
    referralCode: referralCode,
    ownerUid: referrerUid,
    newUserUid: user.uid,
    joinedAt: serverTimestamp()
   });
  }

  message.style.color = "green";
  message.textContent = "Registration successful!";

  alert("Account created successfully!");

  window.location.href = "dashboard.html";

 } catch(error) {

  console.error(error);

  message.style.color = "red";

  if(error.code === "auth/email-already-in-use"){
   message.textContent = "This email is already registered.";
  }else if(error.code === "auth/weak-password"){
   message.textContent = "Please choose a stronger password.";
  }else if(error.code === "auth/invalid-email"){
   message.textContent = "Invalid email address.";
  }else{
   message.textContent = error.message || "Registration failed. Please try again.";
  }

 } finally {
  registerBtn.disabled = false;
  registerBtn.textContent = "CREATE ACCOUNT";
 }

});

</script>

</body>
</html>
