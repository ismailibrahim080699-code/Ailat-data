
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - AILAT DATA</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 16px;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif;color:#21133f;background:radial-gradient(circle at top left,#eee7ff 0,#f8f6ff 42%,#eee9fb 100%)}
.container{width:100%;max-width:440px;background:rgba(255,255,255,.96);padding:34px 30px 28px;border:1px solid #fff;border-radius:24px;box-shadow:0 22px 65px rgba(55,25,100,.13)}
.brand-mark{width:76px;height:76px;margin:0 auto 12px;display:block;object-fit:contain;filter:drop-shadow(0 6px 12px #6d28d922)}
.logo{text-align:center;color:#35136f;font-size:23px;font-weight:800;letter-spacing:1.2px}
.subtitle{text-align:center;color:#817694;font-size:14px;margin:8px 0 26px}
label{display:block;margin:16px 0 7px;font-size:13px;font-weight:700;color:#44345f}
input{width:100%;padding:14px 15px;border:1px solid #e4deef;border-radius:11px;background:#fcfbff;font-size:14px;color:#24134d;transition:.2s}
input::placeholder{color:#aaa1b9}
input:focus{outline:none;border-color:#8b5cf6;background:white;box-shadow:0 0 0 4px #8b5cf618}
.password-box{position:relative}
.password-box input{padding-right:64px}
.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;padding:0;margin:0;background:transparent;color:#7650ad;border:0;border-radius:9px;cursor:pointer;box-shadow:none}
.toggle-password:hover{background:#f2edff;box-shadow:none;transform:translateY(-50%)}
.toggle-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field-hint{font-size:11px;line-height:1.5;color:#9187a2;margin:7px 1px 0}
button{width:100%;padding:15px;border:0;border-radius:11px;background:linear-gradient(110deg,#5b21b6,#7c3aed);color:white;font-size:14px;font-weight:700;letter-spacing:.2px;margin-top:23px;cursor:pointer;box-shadow:0 9px 20px #6d28d926;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 12px 24px #6d28d933}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.links{text-align:center;margin-top:22px;font-size:13px;color:#817694}
a{color:#6d28d9;text-decoration:none;font-weight:700}
.note{font-size:11px;color:#9b92aa;text-align:center;margin:18px 0 0;line-height:1.5}
@media(max-width:420px){body{padding:18px 12px}.container{padding:28px 21px;border-radius:20px}}
</style>
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
</head>

<body>

<div class="container">

<img class="brand-mark" src="assets/ailat-mark.svg" alt="AILAT DATA logo">
<div class="logo">AILAT DATA</div>
<p class="subtitle">Create your account and get started</p>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name"
placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email"
placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" id="phone"
placeholder="Enter phone number"
maxlength="11" required>

<label>Password</label>

<div class="password-box">
<input type="password" id="password"
placeholder="Create a strong password"
minlength="8" required>

<button type="button"
class="toggle-password"
id="togglePassword"
aria-label="Show password"
aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<p class="field-hint">Use at least 12 characters with a mix of letters, numbers and symbols.</p>

<label>Confirm Password</label>

<div class="password-box">
<input type="password" id="confirmPassword"
placeholder="Confirm password"
minlength="8" required>

<button type="button"
class="toggle-password"
id="toggleConfirmPassword"
aria-label="Show password"
aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<label>Referral Code (Optional)</label>
<input type="text" id="referralCode"
placeholder="Enter referral code (if any)">

<button type="submit" id="registerBtn">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<a href="login.html">Login Now</a>
</div>

<p class="note">
Your password is securely handled by Firebase Authentication.
</p>

</div>

<script type="module">

import { app } from "./firebase.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 sendEmailVerification,
 deleteUser
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 writeBatch,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const button = document.getElementById("registerBtn");
const referralInput = document.getElementById("referralCode");

const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

// PASSWORD VISIBILITY

function setupPasswordToggle(inputId, buttonId){

 const passwordInput =
 document.getElementById(inputId);

 const toggleButton =
 document.getElementById(buttonId);

 toggleButton.addEventListener("click", function(){

  if(passwordInput.type === "password"){

   passwordInput.type = "text";
   toggleButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
   toggleButton.setAttribute("aria-label","Hide password");
   toggleButton.setAttribute("aria-pressed","true");

  }else{

   passwordInput.type = "password";
   toggleButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15.8 15.8 0 01-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.4 10.4 0 004.1-.8"/></svg>';
   toggleButton.setAttribute("aria-label","Show password");
   toggleButton.setAttribute("aria-pressed","false");

  }

 });

}

setupPasswordToggle("password","togglePassword");
setupPasswordToggle("confirmPassword","toggleConfirmPassword");

// GET REFERRAL CODE FROM URL

const urlParams =
 new URLSearchParams(window.location.search);

const urlReferralCode =
 (urlParams.get("ref") || "").trim().toUpperCase();

if(urlReferralCode){
 referralInput.value = urlReferralCode;
}

// REGISTRATION

form.addEventListener("submit", async function(event){

 event.preventDefault();

 const name =
 document.getElementById("name").value.trim();

 const email =
 document.getElementById("email").value.trim();

 const phone =
 document.getElementById("phone").value.trim();

 const password = passwordInput.value;
 const confirmPassword = confirmInput.value;

 const referralCode =
 referralInput.value.trim().toUpperCase();

 if(name.length < 2){
  alert("Please enter your full name.");
  return;
 }

 if(phone.length !== 11 || !/^\d{11}$/.test(phone)){
  alert("Please enter a valid 11-digit phone number.");
  return;
 }

 if(password.length < 8){
  alert("Password must contain at least 8 characters.");
  return;
 }

 if(password.length < 12 || !/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)){
  alert("Use at least 12 characters with uppercase and lowercase letters, a number and a symbol.");
  return;
 }

 if(password !== confirmPassword){
  alert("Passwords do not match.");
  return;
 }

 button.disabled = true;
 button.textContent = "Creating Account...";

 let createdUser = null;
 let profileSaved = false;

 try{

  let referrerUid = null;

  if(referralCode !== ""){

   const referralSnap = await getDoc(
    doc(db, "referralCodes", referralCode)
   );

   if(!referralSnap.exists()){
    throw new Error("Invalid Referral Code!");
   }

   referrerUid = referralSnap.data().ownerUid;

   if(!referrerUid){
    throw new Error("This Referral Code is not valid.");
   }

  }

  const result = await createUserWithEmailAndPassword(
   auth,
   email,
   password
  );

  createdUser = result.user;

  const uid = result.user.uid;

  if(referrerUid === uid){
   throw new Error("You cannot use your own referral code.");
  }

  const myReferralCode =
   "AILAT" + uid.substring(0,8).toUpperCase();

  // SAVE THE USER, PERSONAL CODE AND REFERRAL AS ONE ATOMIC WRITE.
  // This prevents a partial referral record if any write is rejected.

  const batch = writeBatch(db);

  batch.set(doc(db, "users", uid), {
   name: name,
   email: email,
   phone: phone,
   walletBalance: 0,
   referralCode: myReferralCode,
   referredBy: referralCode || "",
   createdAt: serverTimestamp()
  });

  batch.set(doc(db, "referralCodes", myReferralCode), {
   ownerUid: uid,
   createdAt: serverTimestamp()
  });

  if(referralCode !== "" && referrerUid){
   batch.set(doc(db, "referrals", uid), {
    referralCode: referralCode,
    ownerUid: referrerUid,
    newUserUid: uid,
    joinedAt: serverTimestamp()
   });
  }

  await batch.commit();
  profileSaved = true;

  // SEND EMAIL VERIFICATION

  await sendEmailVerification(result.user);

  alert(
   "Account created successfully! A verification email has been sent to your email address. Please open your email and click Verify Email before logging in."
  );

  window.location.href = "login.html";

 }catch(error){

  console.error("Registration error:", error);

  if(createdUser && !profileSaved){
   // The Firestore batch did not save the profile; clean up the new Auth account.
   try{
    await deleteUser(createdUser);
   }catch(cleanupError){
    console.error("Incomplete registration cleanup failed:", cleanupError);
    try{ await auth.signOut(); }catch(signOutError){ console.error("Sign out error:",signOutError); }
   }
  }else if(createdUser){
   try{
    await auth.signOut();
   }catch(signOutError){
    console.error("Sign out error:", signOutError);
   }
  }

  if(createdUser && profileSaved && error.code !== "auth/email-already-in-use"){
   alert("Your account details were saved, but the verification email could not be sent. Open Login and use Resend Verification Email. Details: " + error.message);
  }else if(error.code === "auth/email-already-in-use"){

   alert("This email is already registered.");

  }else if(error.code === "auth/weak-password"){

   alert("Password is too weak.");

  }else if(error.code === "auth/invalid-email"){

   alert("Invalid email address.");

  }else if(error.code === "auth/too-many-requests"){

   alert("Too many attempts. Please try again later.");

  }else if(error.code === "auth/operation-not-allowed"){

   alert("Email verification is not available. Check Firebase Authentication settings.");

  }else{

   alert("Registration failed: " + error.message);

  }

 }finally{

  button.disabled = false;
  button.textContent = "Create Account";

 }

});

</script>

</body>
 </html>
