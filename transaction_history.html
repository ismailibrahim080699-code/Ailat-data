
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
<title>Transactions - AILAT DATA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f3ff;
 color:#24134d;
}
header{
 background:linear-gradient(135deg,#4c1d95,#7c3aed);
 color:white;
 padding:25px 20px 30px;
 border-radius:0 0 25px 25px;
 box-shadow:0 5px 18px #5b21b633;
}
header h2{margin:0;font-size:24px}
header p{margin:8px 0 0;font-size:14px;opacity:.9}
.container{
 padding:20px 16px;
 max-width:550px;
 margin:auto;
}
.card{
 background:white;
 padding:20px;
 border-radius:18px;
 margin-bottom:18px;
 box-shadow:0 4px 16px #00000009;
}
.card h3{margin:0;font-size:18px}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.refresh{
 border:0;
 background:#f3e8ff;
 color:#6d28d9;
 padding:10px 13px;
 border-radius:10px;
 font-weight:bold;
}
.message{
 text-align:center;
 padding:40px 12px;
 color:#777;
 line-height:1.6;
}
.message-icon{
 width:70px;
 height:70px;
 border-radius:50%;
 background:#f3e8ff;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:0 auto 15px;
 font-size:32px;
}
.message h3{color:#4c1d95;margin:0 0 8px}
.transaction{
 border:1px solid #eee7fa;
 border-radius:13px;
 padding:15px;
 margin-top:13px;
}
.transaction-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}
.transaction-title{
 font-weight:bold;
 color:#4c1d95;
 text-transform:capitalize;
}
.amount{
 font-weight:bold;
 color:#24134d;
 white-space:nowrap;
}
.details{
 color:#888;
 font-size:12px;
 line-height:1.7;
 margin-top:9px;
 overflow-wrap:anywhere;
}
.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
 text-transform:capitalize;
 margin-top:8px;
 background:#f3f4f6;
 color:#555;
}
.status.success,.status.completed{
 background:#dcfce7;
 color:#166534;
}
.status.pending{
 background:#fef3c7;
 color:#92400e;
}
.status.failed{
 background:#fee2e2;
 color:#991b1b;
}
.back{
 display:block;
 text-align:center;
 text-decoration:none;
 color:white;
 background:#6d28d9;
 padding:15px;
 border-radius:12px;
 font-weight:bold;
 margin-top:20px;
}
.error{color:#b91c1c}
.brand-mark{width:34px;height:34px;object-fit:contain;flex:0 0 34px;vertical-align:middle}
</style>
</head>

<body>

<header>
<img class="brand-mark" src="assets/ailat-mark.svg" alt="AILAT DATA">
 <h2>AILAT DATA</h2>
 <p>Transaction History</p>
</header>

<div class="container">
 <div class="card">
  <div class="top">
   <h3>Recent Transactions</h3>
   <button class="refresh" id="refreshBtn">Refresh</button>
  </div>

  <div id="transactions">
   <div class="message">
    <div class="message-icon">⏳</div>
    <h3>Loading...</h3>
    <p>Please wait while we load your transactions.</p>
   </div>
  </div>
 </div>

 <a href="dashboard.html" class="back">← Back to Dashboard</a>
</div>

<script type="module">
import { app } from "./firebase.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const auth = getAuth(app);

const BACKEND_URL =
"https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-backend";

const ORDER_REQUESTS_URL =
"https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-order-requests";

const SUPABASE_KEY =
"sb_publishable_9wmzpjzVhnby_E3jogTjRw_c22XiDEC";

const container = document.getElementById("transactions");
const refreshBtn = document.getElementById("refreshBtn");

function showMessage(icon,title,message,isError=false){
 container.innerHTML = `
  <div class="message">
   <div class="message-icon">${icon}</div>
   <h3 class="${isError ? "error" : ""}">${title}</h3>
   <p>${message}</p>
  </div>
 `;
}

function safe(value){
 return String(value ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function formatDate(value){
 if(!value) return "Date unavailable";

 const date = new Date(value);

 if(Number.isNaN(date.getTime())) return "Date unavailable";

 return date.toLocaleString("en-NG",{
  dateStyle:"medium",
  timeStyle:"short"
 });
}

function formatAmount(value){
 const amount = Number(value);

 if(!Number.isFinite(amount)) return "₦0.00";

 return "₦" + amount.toLocaleString("en-NG",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function renderTransactions(items){
 if(!Array.isArray(items) || items.length === 0){
  showMessage(
   "📋",
   "No Transactions Yet",
   "Your data and airtime order requests, along with recorded transactions, will appear here."
  );
  return;
 }

 container.innerHTML = items.map(item => {
  const type = safe(item.type || "Transaction");
  const rawStatus = String(item.status || "unknown").toLowerCase();
  const customer = item.customer_data && typeof item.customer_data === "object" ? item.customer_data : {};
  const network = customer.network ? String(customer.network).toUpperCase() : "";
  const phone = customer.phone ? String(customer.phone) : "";
  const bundle = customer.bundle ? String(customer.bundle) : "";
  const purchaseType = customer.purchase_type ? String(customer.purchase_type) : "";
  const validity = customer.validity ? String(customer.validity) : "";
  const detailRows = [
   network ? `<div>Network: ${safe(network)}</div>` : "",
   phone ? `<div>Phone: ${safe(phone)}</div>` : "",
   bundle ? `<div>Bundle: ${safe(bundle)}</div>` : "",
   purchaseType ? `<div>Plan Type: ${safe(purchaseType)}</div>` : "",
   validity ? `<div>Validity: ${safe(validity)}</div>` : "",
   customer.amount !== undefined ? `<div>Airtime Amount: ${formatAmount(customer.amount)}</div>` : ""
  ].join("");
  const status = rawStatus === "received" ? "pending" : rawStatus;
  const statusLabel = rawStatus === "received" ? "Request Recorded" : status.charAt(0).toUpperCase() + status.slice(1);
  const amount = item.amount === null || item.amount === undefined || item.amount === ""
   ? "—"
   : formatAmount(item.amount);
  const amountDisplay = item.is_request && amount !== "—" ? "Requested: " + amount : amount;

  return `
   <div class="transaction">
    <div class="transaction-top">
     <div class="transaction-title">${type}</div>
     <div class="amount">${safe(amountDisplay)}</div>
    </div>

    <div class="details">
     <div>Date: ${safe(formatDate(item.created_at))}</div>
     ${detailRows}
     <div>Description: ${safe(item.description || "Transaction")}</div>
     ${item.reference ? `<div>Reference: ${safe(item.reference)}</div>` : ""}
    </div>

    <span class="status ${safe(status)}">${safe(statusLabel)}</span>
   </div>
  `;
 }).join("");
}

async function loadTransactions(user){
 try{
  showMessage("⏳","Loading...","Please wait while we load your transactions.");

  const token = await user.getIdToken(true);
  const headers = {
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer " + token
  };

  const [transactionResponse, requestResponse] = await Promise.all([
   fetch(BACKEND_URL + "?action=transactions", { method:"GET", headers }),
   fetch(ORDER_REQUESTS_URL, { method:"GET", headers })
  ]);

  const [transactionResult, requestResult] = await Promise.all([
   transactionResponse.json(),
   requestResponse.json()
  ]);

  if(!transactionResponse.ok || transactionResult.success === false){
   throw new Error(transactionResult.error || "Unable to load recorded transactions.");
  }

  if(!requestResponse.ok || requestResult.success === false){
   throw new Error(requestResult.error || "Unable to load order requests.");
  }

  const transactions = transactionResult.transactions || transactionResult.data || [];
  const requests = (requestResult.order_requests || []).map(request => ({
   type: String(request.service_key || "service") + " order request",
   amount: request.requested_amount,
   created_at: request.created_at,
   description: "Request received. No payment was taken and no service has been delivered.",
   reference: request.reference,
   status: request.status || "received",
   is_request: true,
   customer_data: request.customer_data || {}
  }));

  const combined = [...transactions, ...requests].sort((a,b) =>
   new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
  );

  renderTransactions(combined);

 }catch(error){
  console.error("Transaction error:",error);

  showMessage(
   "⚠️",
   "Unable to Load History",
   error.message || "Please check your internet connection and try again.",
   true
  );
 }
}

let currentUser = null;

onAuthStateChanged(auth, user => {
 currentUser = user;

 if(!user){
  showMessage(
   "🔒",
   "Login Required",
   "Please login to view your transaction history."
  );

  setTimeout(()=>{
   window.location.href = "login.html";
  },1500);

  return;
 }

 loadTransactions(user);
});

refreshBtn.addEventListener("click",()=>{
 if(currentUser){
  loadTransactions(currentUser);
 }
});
</script>

</body>
</html>
