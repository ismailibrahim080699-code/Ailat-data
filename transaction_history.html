<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions - AILAT DATA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f3ff;color:#24134d}
header{background:#5b21b6;color:white;padding:22px 18px;border-radius:0 0 22px 22px}
header h2{margin:0}
header p{margin:7px 0 0;font-size:14px}
.container{padding:18px}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px;box-shadow:0 3px 12px #0000000d}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:none}
.left h4{margin:0 0 6px;font-size:15px}
.left p{margin:0;color:#888;font-size:12px}
.amount{font-weight:bold;color:#5b21b6}
.status{font-size:11px;color:#d97706;background:#fef3c7;padding:5px 8px;border-radius:20px;display:inline-block;margin-top:5px}
.empty{text-align:center;padding:30px 10px;color:#888}
a{display:block;text-align:center;text-decoration:none;color:#6d28d9;margin:20px}
</style>
</head>
<body><header>
<h2>AILAT DATA</h2>
<p>Transaction History</p>
</header><div class="container"><div class="card">
<h3>Recent Transactions</h3><div class="item">
<div class="left">
<h4>Data Purchase</h4>
<p>Demo transaction</p>
<span class="status">Pending Demo</span>
</div>
<div class="amount">₦500</div>
</div><div class="item">
<div class="left">
<h4>Airtime Purchase</h4>
<p>Demo transaction</p>
<span class="status">Pending Demo</span>
</div>
<div class="amount">₦200</div>
</div><div class="empty">
<p>This is sample transaction history.</p>
<p>Real transactions will appear here after backend integration.</p>
</div></div><a href="dashboard.html">← Back to Dashboard</a>

</div></body>
  </html>
