
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
<title>Transactions - AILAT DATA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f3ff;
 color:#24134d;
}
header{
 background:linear-gradient(135deg,#4c1d95,#7c3aed);
 color:white;
 padding:25px 20px 30px;
 border-radius:0 0 25px 25px;
 box-shadow:0 5px 18px #5b21b633;
}
header h2{margin:0;font-size:24px}
header p{margin:8px 0 0;font-size:14px;opacity:.9}
.container{
 padding:20px 16px;
 max-width:550px;
 margin:auto;
}
.card{
 background:white;
 padding:20px;
 border-radius:18px;
 margin-bottom:18px;
 box-shadow:0 4px 16px #00000009;
}
.card h3{margin:0;font-size:18px}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.refresh{
 border:0;
 background:#f3e8ff;
 color:#6d28d9;
 padding:10px 13px;
 border-radius:10px;
 font-weight:bold;
}
.message{
 text-align:center;
 padding:40px 12px;
 color:#777;
 line-height:1.6;
}
.message-icon{
 width:70px;
 height:70px;
 border-radius:50%;
 background:#f3e8ff;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:0 auto 15px;
 font-size:32px;
}
.message h3{color:#4c1d95;margin:0 0 8px}
.transaction{
 border:1px solid #eee7fa;
 border-radius:13px;
 padding:15px;
 margin-top:13px;
}
.transaction-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}
.transaction-title{
 font-weight:bold;
 color:#4c1d95;
 text-transform:capitalize;
}
.amount{
 font-weight:bold;
 color:#24134d;
 white-space:nowrap;
}
.details{
 color:#888;
 font-size:12px;
 line-height:1.7;
 margin-top:9px;
 overflow-wrap:anywhere;
}
.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
 text-transform:capitalize;
 margin-top:8px;
 background:#f3f4f6;
 color:#555;
}
.status.success,.status.completed{
 background:#dcfce7;
 color:#166534;
}
.status.pending,.status.processing{
 background:#fef3c7;
 color:#92400e;
}
.status.request-recorded{
 background:#f3e8ff;
 color:#6d28d9;
}
.status.rejected,.status.failed,.status.cancelled{
 background:#fee2e2;
 color:#991b1b;
}
.status.failed{
 background:#fee2e2;
 color:#991b1b;
}
.back{
 display:block;
 text-align:center;
 text-decoration:none;
 color:white;
 background:#6d28d9;
 padding:15px;
 border-radius:12px;
 font-weight:bold;
 margin-top:20px;
}
.error{color:#b91c1c}
.brand-mark{width:34px;height:34px;object-fit:contain;flex:0 0 34px;vertical-align:middle}
</style>
</head>

<body>

<header>
<img class="brand-mark" src="assets/ailat-mark.svg" alt="AILAT DATA">
 <h2>AILAT DATA</h2>
 <p>Transaction History</p>
</header>

<div class="container">
 <div class="card">
  <div class="top">
   <h3>Recent Transactions</h3>
   <button class="refresh" id="refreshBtn">Refresh</button>
  </div>

  <div id="transactions">
   <div class="message">
    <div class="message-icon">⏳</div>
    <h3>Loading...</h3>
    <p>Please wait while we load your transactions.</p>
   </div>
  </div>
 </div>

 <a href="dashboard.html" class="back">← Back to Dashboard</a>
</div>

<script type="module">
import { app } from "./firebase.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const auth = getAuth(app);

const BACKEND_URL =
"https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-backend";

const ORDER_REQUESTS_URL =
"https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-order-requests";

const SUPABASE_KEY =
"sb_publishable_9wmzpjzVhnby_E3jogTjRw_c22XiDEC";

const container = document.getElementById("transactions");
const refreshBtn = document.getElementById("refreshBtn");

function showMessage(icon,title,message,isError=false){
 const wrapper = document.createElement("div");
 wrapper.className = "message";

 const iconElement = document.createElement("div");
 iconElement.className = "message-icon";
 iconElement.textContent = String(icon ?? "");

 const titleElement = document.createElement("h3");
 if(isError) titleElement.className = "error";
 titleElement.textContent = String(title ?? "");

 const messageElement = document.createElement("p");
 messageElement.textContent = String(message ?? "");

 wrapper.append(iconElement,titleElement,messageElement);
 container.replaceChildren(wrapper);
}

function safe(value){
 return String(value ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function formatDate(value){
 if(!value) return "Date unavailable";

 const date = new Date(value);

 if(Number.isNaN(date.getTime())) return "Date unavailable";

 return date.toLocaleString("en-NG",{
  dateStyle:"medium",
  timeStyle:"short"
 });
}

function formatAmount(value){
 const amount = Number(value);

 if(!Number.isFinite(amount)) return "—";

 return "₦" + amount.toLocaleString("en-NG",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function renderTransactions(items){
 if(!Array.isArray(items) || items.length === 0){
  showMessage(
   "📋",
   "No Transactions Yet",
   "Your data and airtime order requests, along with recorded transactions, will appear here."
  );
  return;
 }

 container.innerHTML = items.map(item => {
  const type = safe(item.type || "Transaction");
  const rawStatus = String(item.status || "unknown").toLowerCase();
  const customer = item.customer_data && typeof item.customer_data === "object" ? item.customer_data : {};
  const network = customer.network ? String(customer.network).toUpperCase() : "";
  const phone = customer.phone ? String(customer.phone) : "";
  const bundle = customer.bundle ? String(customer.bundle) : "";
  const purchaseType = customer.purchase_type ? String(customer.purchase_type) : "";
  const validity = customer.validity ? String(customer.validity) : "";
  const providerPlanId = item.supplier_plan_id ?? customer.supplier_plan_id;
  const providerNetworkId = item.supplier_network_id ?? customer.provider_network_id;
  const dispatchState = item.provider_dispatch_status || customer.provider_dispatch_status || "not_sent";
  const detailRows = [
   network ? `<div>Network: ${safe(network)}</div>` : "",
   phone ? `<div>Phone: ${safe(phone)}</div>` : "",
   bundle ? `<div>Bundle: ${safe(bundle)}</div>` : "",
   purchaseType ? `<div>Plan Type: ${safe(purchaseType)}</div>` : "",
   validity ? `<div>Validity: ${safe(validity)}</div>` : "",
   providerNetworkId !== undefined && providerNetworkId !== null ? `<div>Supplier Network ID: ${safe(providerNetworkId)}</div>` : "",
   providerPlanId !== undefined && providerPlanId !== null ? `<div>Supplier Plan ID: ${safe(providerPlanId)}</div>` : "",
   item.is_request ? `<div>Supplier Dispatch: ${safe(dispatchState === "disabled_safe_mode" || dispatchState === "not_sent" ? "Not sent (safe mode)" : dispatchState)}</div>` : "",
   customer.amount !== undefined ? `<div>Airtime Amount: ${formatAmount(customer.amount)}</div>` : ""
  ].join("");
  const statusClass = ["completed","success","received","pending","processing","failed","rejected","cancelled"].includes(rawStatus)
   ? (rawStatus === "received" ? "request-recorded" : rawStatus)
   : "unknown";
  const statusLabel = ({
   received:"Request Recorded",
   pending:"Pending",
   processing:"Processing",
   completed:"Completed",
   success:"Successful",
   failed:"Failed",
   rejected:"Rejected",
   cancelled:"Cancelled",
   unknown:"Status Unavailable"
  })[rawStatus] || "Status Unavailable";
  const amount = item.amount === null || item.amount === undefined || item.amount === ""
   ? "—"
   : formatAmount(item.amount);
  const amountDisplay = item.is_request && amount !== "—" ? "Requested: " + amount : amount;

  return `
   <div class="transaction">
    <div class="transaction-top">
     <div class="transaction-title">${type}</div>
     <div class="amount">${safe(amountDisplay)}</div>
    </div>

    <div class="details">
     <div>Date: ${safe(formatDate(item.created_at))}</div>
     ${detailRows}
     <div>Description: ${safe(item.description || "Transaction")}</div>
     ${item.reference ? `<div>Reference: ${safe(item.reference)}</div>` : ""}
    </div>

    <span class="status ${safe(statusClass)}">${safe(statusLabel)}</span>
   </div>
  `;
 }).join("");
}

let isLoadingTransactions = false;

async function loadTransactions(user){
 if(isLoadingTransactions) return;
 isLoadingTransactions = true;
 refreshBtn.disabled = true;
 refreshBtn.textContent = "Loading…";
 try{
  showMessage("⏳","Loading...","Please wait while we load your transactions.");

  const token = await user.getIdToken(true);
  const headers = {
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer " + token
  };

  const results = await Promise.allSettled([
   fetch(BACKEND_URL + "?action=transactions", { method:"GET", headers }),
   fetch(ORDER_REQUESTS_URL, { method:"GET", headers })
  ]);

  async function readResult(result){
   if(result.status !== "fulfilled") return { ok:false, data:null };
   try{
    const data = await result.value.json();
    return { ok:result.value.ok && data.success !== false, data };
   }catch{
    return { ok:false, data:null };
   }
  }

  const [transactionResult, requestResult] = await Promise.all(results.map(readResult));
  if(!transactionResult.ok && !requestResult.ok){
   throw new Error("Unable to load transactions or order requests. Please refresh and try again.");
  }

  const transactions = transactionResult.ok
   ? (transactionResult.data.transactions || transactionResult.data.data || [])
   : [];
  const requestRows = requestResult.ok && Array.isArray(requestResult.data.order_requests)
   ? requestResult.data.order_requests
   : [];
  const requests = requestRows.map(request => ({
   type: String(request.service_key || "service") + " order request",
   amount: request.requested_amount,
   created_at: request.created_at,
   description: "Request record only. No payment was taken and no service was delivered.",
   reference: request.reference,
   status: request.status || "received",
   is_request: true,
   supplier_plan_id: request.supplier_plan_id,
   supplier_network_id: request.supplier_network_id,
   provider_dispatch_status: request.provider_dispatch_status,
   customer_data: request.customer_data || {}
  }));

  const transactionRows = Array.isArray(transactions) ? transactions : [];
  // Merge both history sources without showing the same reference twice.
  const seenReferences = new Set();
  const combined = [...transactionRows, ...requests].filter(item => {
   const reference = String(item.reference || "").trim();
   if(!reference) return true;
   if(seenReferences.has(reference)) return false;
   seenReferences.add(reference);
   return true;
  }).sort((a,b) => {
   const aTime = new Date(a.created_at || 0).getTime();
   const bTime = new Date(b.created_at || 0).getTime();
   return (Number.isFinite(bTime) ? bTime : 0) - (Number.isFinite(aTime) ? aTime : 0);
  });

  renderTransactions(combined);
  if(!transactionResult.ok || !requestResult.ok){
   const warning=document.createElement("p");
   warning.className="details";
   warning.style.color="#9a6700";
   warning.textContent="Some history sources could not be reached. Refresh to try loading the missing records.";
   container.prepend(warning);
  }

 }catch(error){
  console.error("Transaction error:",error);

  showMessage(
   "⚠️",
   "Unable to Load History",
   error.message || "Please check your internet connection and try again.",
   true
  );
 }finally{
  isLoadingTransactions = false;
  refreshBtn.disabled = false;
  refreshBtn.textContent = "Refresh";
 }
}

let currentUser = null;

onAuthStateChanged(auth, async user => {
 currentUser = user;

 if(!user){
  showMessage(
   "🔒",
   "Login Required",
   "Please login to view your transaction history."
  );
  window.location.replace("login.html");
  return;
 }

 try{
  await user.reload();
  if(!user.emailVerified){
   showMessage(
    "🔒",
    "Email Verification Required",
    "Please verify your email address before viewing transaction history."
   );
   window.location.replace("login.html");
   return;
  }
  await loadTransactions(user);
 }catch(error){
  console.error("Account verification error:",error);
  showMessage(
   "⚠️",
   "Unable to Verify Account",
   "Please refresh the page or sign in again.",
   true
  );
 }
});

refreshBtn.addEventListener("click",()=>{
 if(currentUser){
  loadTransactions(currentUser);
 }
});
</script>

</body>
</html>
