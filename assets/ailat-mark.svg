<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">AILAT DATA logo</title><desc id="desc">A white letter A crossed by a gold swoosh inside a purple circle, with AILAT DATA lettering.</desc>
