 <radialGradient id="bg" cx="35%" cy="24%" r="90%"><stop offset="0" stop-color="#5410a8"/><stop offset=".58" stop-color="#350078"/><stop offset="1" stop-color="#21004f"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#e8dcff"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fff0a3"/><stop offset=".25" stop-color="#ffd02f"/><stop offset=".62" stop-color="#f5a900"/><stop offset="1" stop-color="#c77b00"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
